<!doctype html>
<html lang="en">

    <!-- Responsive -->

      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Browser Title -->
    <title>Akmal.dev | Muhamad Akmal Maulana</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Explore the portfolio of Muhamad Akmal Maulana, a Full Stack Web Developer specializing in Laravel, PHP, React, JavaScript, and MySQL. Discover projects, technical skills, and professional experience."
    />

    <meta
      name="author"
      content="Muhamad Akmal Maulana"
    />

    <meta
      name="theme-color"
      content="#050d19"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://portofolio-akmal-dev.vercel.app/"
    />

    <!-- Open Graph: Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Akmal.dev | Muhamad Akmal Maulana - Full Stack Web Developer"
    />

    <meta
      property="og:description"

      property="og:url"
      content="https://portofolio-akmal-dev.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Akmal.dev"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <!-- Open Graph Preview Image -->
    <meta
      property="og:image"
      content="https://portofolio-akmal-dev.vercel.app/og-preview.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://portofolio-akmal-dev.vercel.app/og-preview.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Akmal.dev - Muhamad Akmal Maulana, Full Stack Web Developer Portfolio"
    />

    <!-- Twitter / X -->

    />

    <meta
      name="twitter:description"

    />

    <meta
      name="twitter:image"
      content="https://portofolio-akmal-dev.vercel.app/og-preview.png"
    />

    <meta
      name="twitter:image:alt"
      content="Akmal.dev - Full Stack Web Developer Portfolio"
    />
